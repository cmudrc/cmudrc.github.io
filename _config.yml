    - "https://huggingface.co/cmudrc"
    - "https://www.linkedin.com/company/design-research-collective"
    - "https://twitter.com/cmudrc"

# Analytics
analytics:
  provider               : false # false (default), "google", "google-universal", "google-gtag", "custom"
  google:
    tracking_id          :
    anonymize_ip         : # true, false (default)


# Site Author
author:
